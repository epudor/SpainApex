name: Construir y desplegar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue simultáneo; no cancelamos los que ya están en curso
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Construir el sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cache-version: 1

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construir con Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: Desplegar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
