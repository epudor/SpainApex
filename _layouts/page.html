---
layout: default
---
<article class="page-shell">
  <div class="container">
    <header>
      {%- if page.eyebrow %}
      <span class="eyebrow page-eyebrow">{{ page.eyebrow }}</span>
      {%- endif %}
      <h1>{{ page.heading | default: page.title }}</h1>
      {%- if page.lead %}
      <p class="page-lead">{{ page.lead }}</p>
      {%- endif %}
      {%- if page.updated %}
      <div class="page-updated">Última actualización: {{ page.updated }}</div>
      {%- endif %}
    </header>
    <div class="page-body">
      {{ content }}
    </div>
  </div>
</article>
